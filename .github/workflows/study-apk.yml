name: Build GPT Study Notes APK
on:
  push:
    branches: [main]
    paths:
      - 'study-tool/**'
      - '.github/workflows/study-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p study-tool :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Study-Notes-APK
          path: study-tool/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
